<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق أوراد - وردك اليومي وأذكارك</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo for modern Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 font-cairo text-slate-100 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- حاوية التطبيق المتجاوبة مع الهواتف -->
    <div class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl p-6 border border-slate-700 my-4">
        
        <!-- رأس التطبيق مع الشعار الجديد -->
        <header class="text-center pb-6 border-b border-slate-700">
            <div class="flex justify-center mb-3">
                <img src="https://cdn-icons-png.flaticon.com/512/3050/3050525.png" alt="شعار تطبيق أوراد" class="w-20 h-20 rounded-3xl object-cover shadow-lg border-2 border-emerald-600/50 bg-slate-700 p-2">
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">تطبيق أوراد</h1>
            <p class="text-sm text-slate-400 mt-1">وردك اليومي وأذكارك بكل سهولة</p>
        </header>

        <!-- المحتوى الرئيسي / الأذكار والورد -->
        <main class="py-6 space-y-4">
            <div class="bg-slate-700/50 p-4 rounded-2xl border border-slate-600/50 text-center">
                <span class="text-xs text-emerald-400 font-semibold uppercase tracking-wider">الورد الحالي</span>
                <p class="text-lg font-medium text-slate-200 mt-2">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</p>
                
                <!-- عداد التسبيح -->
                <div class="mt-4 flex items-center justify-center space-x-3 space-x-reverse">
                    <span id="counter" class="text-3xl font-bold text-emerald-400">0</span>
                    <span class="text-xs text-slate-400">مرة</span>
                </div>
            </div>

            <!-- أزرار التفاعل -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="incrementCounter()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30 flex items-center justify-center space-x-2 space-x-reverse active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>تسبيح</span>
                </button>
                <button onclick="resetCounter()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center space-x-2 space-x-reverse active:scale-95">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>إعادة</span>
                </button>
            </div>
        </main>

        <!-- تذييل التطبيق -->
        <footer class="text-center pt-4 border-t border-slate-700 text-xs text-slate-500">
            صُمم بحب ليكون رفيقك اليومي ❤️
        </footer>
    </div>

    <!-- برمجة بسيطة للعداد -->
    <script>
        let count = 0;
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = count;
        }
        function resetCounter() {
            count = 0;
            document.getElementById('counter').innerText = count;
        }
    </script>
</body>
</html>
